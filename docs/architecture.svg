<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Manrope, Inter, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1c19"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6df6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1fa463"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/></marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14120a" flood-opacity="0.10"/></filter>
    <style>
      .ext { fill: #f1efe9; stroke: #d6d3ca; }
      .box { fill: #ffffff; stroke: #e7e4dc; }
      .iface { fill: #fcfbf8; stroke: #1d1c19; stroke-dasharray: 5 3; }
      .plug { fill: #ffffff; stroke: #b3afa5; stroke-dasharray: 5 3; }
      .h { font-weight: 700; fill: #1d1c19; font-size: 14px; }
      .h2 { font-weight: 700; fill: #1d1c19; font-size: 13px; }
      .p { fill: #7a776f; font-size: 11.5px; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; font-size: 11px; fill: #1d1c19; }
      .lbl { font-size: 10.5px; font-weight: 700; fill: #7a776f; letter-spacing: 1.4px; }
      .edge { font-size: 11px; fill: #7a776f; }
      .tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="860" fill="#f6f5f1"/>

  <text x="40" y="40" font-size="21" font-weight="800" fill="#1d1c19">VoiceCode · components and interfaces</text>
  <text x="40" y="60" fill="#7a776f">Solid boxes exist today. Dashed boxes plug into the same interface. Grey boxes are external services.</text>

  <!-- ===== legend ===== -->
  <rect x="860" y="28" width="14" height="14" rx="3" class="box"/><text x="880" y="40" class="p">implemented</text>
  <rect x="960" y="28" width="14" height="14" rx="3" class="plug"/><text x="980" y="40" class="p">pluggable</text>
  <rect x="1050" y="28" width="14" height="14" rx="3" class="ext"/><text x="1070" y="40" class="p">external</text>
  <rect x="860" y="48" width="14" height="14" rx="3" class="iface"/><text x="880" y="60" class="p">interface (contract the rest of the system depends on)</text>

  <!-- ===== BROWSER ===== -->
  <g filter="url(#s)"><rect x="40" y="100" width="250" height="150" rx="14" class="box"/></g>
  <text x="60" y="124" class="lbl">CLIENT</text>
  <text x="60" y="146" class="h">Browser · React + Vite</text>
  <text x="60" y="166" class="p">push-to-talk mic · queue · Stop / Resume</text>
  <text x="60" y="182" class="p">project preview (iframe) · conversation log</text>
  <text x="60" y="198" class="p">@elevenlabs/react SDK for audio</text>
  <text x="60" y="222" class="mono">relays notifications via</text>
  <text x="60" y="236" class="mono">conversation.sendUserMessage()</text>

  <!-- ===== ELEVENLABS ===== -->
  <g filter="url(#s)"><rect x="420" y="100" width="330" height="150" rx="14" class="ext"/></g>
  <text x="440" y="124" class="lbl">VOICE PLATFORM · EXTERNAL</text>
  <text x="440" y="146" class="h">ElevenLabs Conversational Agent</text>
  <text x="440" y="166" class="p">speech-to-text (Scribe) · turn detection · interruption</text>
  <text x="440" y="182" class="p">text-to-speech · WebRTC session with the browser</text>
  <text x="440" y="206" class="p">configured with "Custom LLM": its brain is our server</text>
  <text x="440" y="226" class="mono">ASR keywords ← project vocabulary (synced by API)</text>

  <!-- browser <-> elevenlabs -->
  <line x1="290" y1="150" x2="420" y2="150" stroke="#1d1c19" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="355" y="142" text-anchor="middle" class="edge">audio · WebRTC</text>

  <!-- ===== TUNNEL ===== -->
  <g filter="url(#s)"><rect x="880" y="100" width="280" height="150" rx="14" class="ext"/></g>
  <text x="900" y="124" class="lbl">LLM PROVIDERS · EXTERNAL</text>
  <rect x="900" y="134" width="240" height="30" rx="8" class="box"/>
  <text x="912" y="153" class="h2">Groq · gpt-oss-20b</text><text x="1132" y="153" text-anchor="end" class="p">today · ~300 ms</text>
  <rect x="900" y="170" width="240" height="30" rx="8" class="box"/>
  <text x="912" y="189" class="h2">Gemini API · Gemma 4, flash</text><text x="1132" y="189" text-anchor="end" class="p">fallback</text>
  <rect x="900" y="206" width="240" height="30" rx="8" class="plug"/>
  <text x="912" y="225" class="p">any OpenAI-compatible endpoint · Ollama</text>

  <!-- ===== SERVER ===== -->
  <g filter="url(#s)"><rect x="40" y="310" width="1120" height="330" rx="16" class="box"/></g>
  <text x="60" y="334" class="lbl">VOICECODE SERVER · NODE 22 · FASTIFY · SINGLE PROCESS</text>

  <!-- Custom LLM endpoint -->
  <rect x="420" y="352" width="330" height="88" rx="12" fill="#e8efff" stroke="#cfdcff"/>
  <text x="436" y="374" class="h">Custom LLM endpoint</text>
  <text x="436" y="392" class="mono">POST /v1/chat/completions · OpenAI chat + SSE</text>
  <text x="436" y="410" class="p">builds the prompt: rules, queue state, live agent events,</text>
  <text x="436" y="426" class="p">unannounced results, project vocabulary, analyst notes</text>

  <!-- elevenlabs -> endpoint -->
  <line x1="585" y1="250" x2="585" y2="352" stroke="#2f6df6" stroke-width="1.8" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="596" y="286" class="edge" fill="#2f6df6">HTTPS via cloudflared tunnel</text>
  <text x="596" y="302" class="edge" fill="#2f6df6">transcript in · speech out</text>

  <!-- browser -> server -->
  <line x1="165" y1="250" x2="165" y2="352" stroke="#1d1c19" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="176" y="286" class="edge">REST + WebSocket</text>
  <text x="176" y="302" class="edge">state · events · notifications</text>

  <!-- LLM provider interface -->
  <rect x="790" y="352" width="340" height="88" rx="12" class="iface"/>
  <text x="806" y="374" class="h">LLM provider</text><text x="920" y="374" class="tag" fill="#1d1c19">INTERFACE</text>
  <text x="806" y="392" class="mono">llm(prompt, {json}) → text</text>
  <text x="806" y="410" class="p">no tool calling required · timeout, retry, fallback chain</text>
  <text x="806" y="426" class="p">order set by env: GROQ_MODEL, GEMMA_MODELS</text>
  <line x1="1010" y1="250" x2="1010" y2="352" stroke="#1d1c19" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1020" y="294" class="edge">HTTPS</text>
  <line x1="750" y1="396" x2="790" y2="396" stroke="#2f6df6" stroke-width="1.8" marker-end="url(#ab)"/>

  <!-- Conversation + analyst (left of endpoint) -->
  <rect x="60" y="352" width="330" height="88" rx="12" class="box"/>
  <text x="76" y="374" class="h">Orchestrator</text>
  <text x="76" y="392" class="p">FIFO queue · one active run · Stop / Resume</text>
  <text x="76" y="408" class="p">task status from exit codes · announces results once</text>
  <text x="76" y="424" class="p">JSONL event log · transcript log · in-memory state</text>
  <line x1="420" y1="396" x2="390" y2="396" stroke="#1fa463" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="405" y="346" text-anchor="middle" class="edge" fill="#1fa463">typed actions</text>

  <!-- Event analyst -->
  <rect x="420" y="462" width="330" height="70" rx="12" fill="#fdf3e1" stroke="#f3dfb8"/>
  <text x="436" y="484" class="h">Event analyst</text>
  <text x="436" y="502" class="p">batches raw agent events → SKIP / REMEMBER / SPEAK</text>
  <text x="436" y="518" class="p">verification facts from exit codes · cooldown · same LLM interface</text>
  <path d="M750,497 L770,497 L770,420 L790,420" fill="none" stroke="#2f6df6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <line x1="390" y1="497" x2="420" y2="497" stroke="#b7791f" stroke-width="1.8" marker-start="url(#am)"/>
  <text x="405" y="456" text-anchor="middle" class="edge" fill="#b7791f">events</text>

  <!-- Vocabulary -->
  <rect x="790" y="462" width="340" height="70" rx="12" class="box"/>
  <text x="806" y="484" class="h">Project vocabulary</text>
  <text x="806" y="502" class="p">identifiers, file names, storage keys, README terms from PROJECT_DIR</text>
  <text x="806" y="518" class="p">rebuilt after each task · pushed to ASR keywords and into the prompt</text>

  <!-- notifications edge: analyst -> orchestrator -> browser -->
  <rect x="60" y="462" width="330" height="70" rx="12" class="box"/>
  <text x="76" y="484" class="h">Notifications</text>
  <text x="76" y="502" class="p">pending until ElevenLabs echoes them back on /v1,</text>
  <text x="76" y="518" class="p">then spoken verbatim · browser resends if lost</text>

  <!-- AgentAdapter interface -->
  <rect x="60" y="556" width="690" height="66" rx="12" class="iface"/>
  <text x="76" y="578" class="h">AgentAdapter</text><text x="196" y="578" class="tag" fill="#1d1c19">INTERFACE</text>
  <text x="76" y="596" class="mono">run(task, {projectDir, threadId}, onEvent) → {threadId, files, exit codes, completed}</text>
  <text x="76" y="612" class="mono">stop() · research(question, projectDir) → answer</text>
  <line x1="225" y1="440" x2="225" y2="556" stroke="#1d1c19" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="236" y="500" class="edge" transform="rotate(0)"></text>

  <!-- Stop button edge -->
  <path d="M90,250 L90,300 L30,300 L30,396 L60,396" fill="none" stroke="#e5484d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="22" y="350" class="edge" fill="#e5484d" transform="rotate(-90 22 350)">Stop: browser → orchestrator, no model</text>

  <!-- ===== AGENTS ===== -->
  <g filter="url(#s)"><rect x="60" y="680" width="330" height="120" rx="14" fill="#e3f5ec" stroke="#c6ead6"/></g>
  <text x="76" y="702" class="lbl">CODING AGENT · TODAY</text>
  <text x="76" y="724" class="h">CodexAdapter → Codex CLI</text>
  <text x="76" y="742" class="mono">codex exec --json --sandbox workspace-write</text>
  <text x="76" y="758" class="mono">codex exec --json --sandbox read-only --ephemeral</text>
  <text x="76" y="778" class="p">JSONL events · thread resume · process-tree kill · network on</text>
  <text x="76" y="792" class="p">two processes side by side: writer + research</text>
  <line x1="225" y1="622" x2="225" y2="680" stroke="#1d1c19" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="420" y="680" width="150" height="120" rx="14" class="plug"/>
  <text x="436" y="702" class="lbl">PLUGGABLE</text>
  <text x="436" y="724" class="h2">OpenCodeAdapter</text>
  <text x="436" y="742" class="p">opencode run</text>
  <text x="436" y="758" class="p">--format json</text>
  <line x1="495" y1="622" x2="495" y2="680" stroke="#b3afa5" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ag)"/>

  <rect x="600" y="680" width="150" height="120" rx="14" class="plug"/>
  <text x="616" y="702" class="lbl">PLUGGABLE</text>
  <text x="616" y="724" class="h2">ClaudeCodeAdapter</text>
  <text x="616" y="742" class="p">claude -p</text>
  <text x="616" y="758" class="p">--output-format stream-json</text>
  <line x1="675" y1="622" x2="675" y2="680" stroke="#b3afa5" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ag)"/>

  <!-- Project dir -->
  <g filter="url(#s)"><rect x="790" y="680" width="370" height="120" rx="14" class="ext"/></g>
  <text x="806" y="702" class="lbl">TARGET · ANY REPOSITORY</text>
  <text x="806" y="724" class="h">Project directory · PROJECT_DIR</text>
  <text x="806" y="742" class="p">today: TaskFlow, a Vite + React demo app with its own git</text>
  <text x="806" y="758" class="p">agents edit files here · dev server shown in the browser preview</text>
  <text x="806" y="778" class="p">"reset the project" = git checkout + clean, done by the server</text>
  <path d="M225,800 L225,816 L975,816 L975,800" fill="none" stroke="#1fa463" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="600" y="830" text-anchor="middle" class="edge" fill="#1fa463">reads and writes files, runs builds, emits events</text>

  <text x="40" y="852" class="p">Nothing above the AgentAdapter line knows which agent runs; nothing outside the LLM provider box knows which model answers; the voice platform only sees an OpenAI-style chat endpoint.</text>
</svg>
