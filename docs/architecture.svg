<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Manrope, Inter, -apple-system, Segoe UI, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a776f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6df6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1fa463"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14120a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#f6f5f1"/>

  <!-- Title -->
  <text x="40" y="44" font-size="22" font-weight="800" fill="#1d1c19" letter-spacing="-0.5">VoiceCode · how a sentence becomes code and comes back as speech</text>
  <text x="40" y="66" fill="#7a776f">Bring your own coding agent. Give it a voice.</text>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="300" height="130" rx="16" fill="#ffffff" stroke="#e7e4dc"/>
  </g>
  <text x="60" y="128" font-size="11" font-weight="700" fill="#7a776f" letter-spacing="1.5">BROWSER · REACT UI</text>
  <text x="60" y="154" font-weight="700" fill="#1d1c19">Headset + push-to-talk</text>
  <text x="60" y="176" fill="#7a776f">Queue · Stop / Resume · live preview</text>
  <text x="60" y="196" fill="#7a776f">Conversation log · Codex events</text>
  <circle cx="300" cy="150" r="22" fill="#2f6df6"/>
  <path transform="translate(288,138) scale(1)" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" fill="#fff"/>

  <!-- ElevenLabs -->
  <g filter="url(#shadow)">
    <rect x="860" y="100" width="300" height="130" rx="16" fill="#ffffff" stroke="#e7e4dc"/>
  </g>
  <text x="880" y="128" font-size="11" font-weight="700" fill="#7a776f" letter-spacing="1.5">ELEVENLABS CONVERSATIONAL AGENT</text>
  <text x="880" y="154" font-weight="700" fill="#1d1c19">Speech in, speech out</text>
  <text x="880" y="176" fill="#7a776f">STT · turn-taking · interruption · TTS</text>
  <text x="880" y="196" fill="#7a776f">Brain = our Custom LLM endpoint</text>

  <!-- audio arrow browser <-> elevenlabs -->
  <line x1="340" y1="150" x2="860" y2="150" stroke="#7a776f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="520" y="134" width="160" height="30" rx="15" fill="#f1efe9" stroke="#e7e4dc"/>
  <text x="600" y="154" text-anchor="middle" fill="#1d1c19" font-weight="600">audio · WebRTC</text>

  <!-- Node server box -->
  <g filter="url(#shadow)">
    <rect x="40" y="290" width="1120" height="430" rx="18" fill="#ffffff" stroke="#e7e4dc"/>
  </g>
  <text x="60" y="318" font-size="11" font-weight="700" fill="#7a776f" letter-spacing="1.5">NODE SERVER · AUTHORITATIVE STATE</text>

  <!-- arrows into server -->
  <line x1="190" y1="230" x2="190" y2="290" stroke="#7a776f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="200" y="266" fill="#7a776f" font-size="12">REST + WebSocket: state, events, notifications</text>
  <line x1="1010" y1="230" x2="1010" y2="290" stroke="#2f6df6" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="1000" y="266" fill="#2f6df6" font-size="12" text-anchor="end">POST /v1/chat/completions · OpenAI format · via tunnel</text>

  <!-- Custom LLM endpoint -->
  <rect x="700" y="340" width="420" height="96" rx="12" fill="#e8efff" stroke="#cfdcff"/>
  <text x="720" y="366" font-weight="700" fill="#2f6df6">Custom LLM endpoint</text>
  <text x="720" y="388" fill="#1d1c19" font-size="13">prompt = rules + queue state + live Codex activity</text>
  <text x="720" y="406" fill="#1d1c19" font-size="13">+ unannounced results + project vocabulary + notes</text>
  <text x="720" y="426" fill="#7a776f" font-size="12">Groq gpt-oss-20b → Gemma 4 → Gemini (fallback chain)</text>

  <!-- LLM output -->
  <rect x="700" y="456" width="200" height="40" rx="10" fill="#fcfbf8" stroke="#e7e4dc"/>
  <text x="800" y="481" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="12" fill="#1d1c19">{"speech", "actions"}</text>
  <line x1="910" y1="436" x2="910" y2="456" stroke="#2f6df6" stroke-width="2"/>
  <line x1="910" y1="456" x2="900" y2="456" stroke="#2f6df6" stroke-width="2"/>

  <!-- speech back -->
  <line x1="900" y1="476" x2="1120" y2="476" stroke="#2f6df6" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="1120" y1="476" x2="1120" y2="436" stroke="#2f6df6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBlue)"/>
  <text x="1010" y="496" text-anchor="middle" fill="#2f6df6" font-size="12">speech → SSE → spoken</text>

  <!-- actions to orchestrator -->
  <line x1="700" y1="476" x2="520" y2="476" stroke="#1fa463" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="610" y="468" text-anchor="middle" fill="#1fa463" font-size="12" font-weight="600">typed actions, validated</text>

  <!-- Orchestrator -->
  <rect x="80" y="340" width="440" height="156" rx="12" fill="#fcfbf8" stroke="#e7e4dc"/>
  <text x="100" y="366" font-weight="700" fill="#1d1c19">Orchestrator</text>
  <text x="100" y="390" fill="#1d1c19" font-size="13">FIFO queue · one active run · Stop kills the process tree</text>
  <text x="100" y="410" fill="#1d1c19" font-size="13">Status from exit codes, never from the model</text>
  <text x="100" y="430" fill="#1d1c19" font-size="13">enqueue · cancel · stop · resume · research · new session · reset project</text>
  <text x="100" y="454" fill="#7a776f" font-size="12">JSONL event log · transcript log · project vocabulary</text>
  <text x="100" y="476" fill="#7a776f" font-size="12">Stop button → server directly, no model in the loop</text>

  <!-- Adapter -->
  <line x1="300" y1="496" x2="300" y2="536" stroke="#7a776f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="536" width="440" height="40" rx="10" fill="#f1efe9" stroke="#e7e4dc"/>
  <text x="300" y="561" text-anchor="middle" font-weight="700" fill="#1d1c19">AgentAdapter · run / stop / research</text>

  <!-- Two codex boxes -->
  <line x1="190" y1="576" x2="190" y2="610" stroke="#7a776f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="576" x2="410" y2="610" stroke="#7a776f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="610" width="220" height="84" rx="12" fill="#e3f5ec" stroke="#c6ead6"/>
  <text x="100" y="634" font-weight="700" fill="#1fa463">Codex · writer</text>
  <text x="100" y="654" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#1d1c19">codex exec --json</text>
  <text x="100" y="670" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#1d1c19">--sandbox workspace-write</text>
  <text x="100" y="686" fill="#7a776f" font-size="11">one thread, resumed across tasks</text>

  <rect x="300" y="610" width="220" height="84" rx="12" fill="#fcfbf8" stroke="#e7e4dc"/>
  <text x="320" y="634" font-weight="700" fill="#1d1c19">Codex · research</text>
  <text x="320" y="654" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#1d1c19">codex exec --ephemeral</text>
  <text x="320" y="670" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#1d1c19">--sandbox read-only</text>
  <text x="320" y="686" fill="#7a776f" font-size="11">runs in parallel, "by the way…"</text>

  <!-- Event analyst -->
  <rect x="700" y="560" width="420" height="134" rx="12" fill="#fdf3e1" stroke="#f3dfb8"/>
  <text x="720" y="586" font-weight="700" fill="#b7791f">Event analyst (LLM)</text>
  <text x="720" y="608" fill="#1d1c19" font-size="13">Reviews every batch of Codex JSONL events</text>
  <text x="720" y="628" fill="#1d1c19" font-size="13">SKIP noise · REMEMBER facts · SPEAK milestones</text>
  <text x="720" y="648" fill="#1d1c19" font-size="13">Plan, file edits, failures, completion with exit codes</text>
  <text x="720" y="672" fill="#7a776f" font-size="12">Cooldown between updates · never speaks over you</text>

  <!-- events arrow codex -> analyst -->
  <line x1="520" y1="652" x2="700" y2="652" stroke="#b7791f" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="610" y="644" text-anchor="middle" fill="#b7791f" font-size="12" font-weight="600">JSONL events</text>

  <!-- notification arrow analyst -> browser (goes up right side) -->
  <path d="M1120,627 L1150,627 L1150,76 L190,76 L190,100" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <rect x="560" y="60" width="300" height="30" rx="15" fill="#fdf3e1" stroke="#f3dfb8"/>
  <text x="710" y="80" text-anchor="middle" fill="#b7791f" font-size="12" font-weight="600">notification → browser → sendUserMessage → spoken</text>

  <!-- Project dir -->
  <rect x="80" y="704" width="440" height="0" fill="none"/>
  <text x="300" y="745" text-anchor="middle" fill="#7a776f" font-size="12">▼ project directory (any repo: TaskFlow demo app today)</text>
</svg>
