<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Manrope, Inter, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1c19"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3afa5"/></marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14120a" flood-opacity="0.10"/></filter>
    <style>
      .box { fill: #ffffff; stroke: #e7e4dc; }
      .ext { fill: #f1efe9; stroke: #d6d3ca; }
      .plug { fill: none; stroke: #b3afa5; stroke-dasharray: 5 3; }
      .iface { fill: #fcfbf8; stroke: #1d1c19; stroke-width: 1.5; stroke-dasharray: 6 3; }
      .t { font-weight: 800; fill: #1d1c19; font-size: 17px; }
      .t2 { font-weight: 700; fill: #1d1c19; font-size: 15px; }
      .sub { fill: #7a776f; font-size: 13px; }
      .edge { fill: #7a776f; font-size: 12px; font-weight: 600; }
      .tag { font-size: 10px; font-weight: 800; letter-spacing: 1.2px; fill: #7a776f; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; font-size: 12px; fill: #1d1c19; }
    </style>
  </defs>
  <rect width="1100" height="640" fill="#f6f5f1"/>

  <!-- Row 1 -->
  <g filter="url(#s)"><rect x="40" y="40" width="260" height="90" rx="14" class="box"/></g>
  <text x="60" y="72" class="t">Browser</text>
  <text x="60" y="94" class="sub">React UI · mic · queue · Stop</text>

  <line x1="300" y1="85" x2="420" y2="85" stroke="#1d1c19" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="360" y="76" text-anchor="middle" class="edge">audio</text>

  <g filter="url(#s)"><rect x="420" y="40" width="260" height="90" rx="14" class="ext"/></g>
  <text x="440" y="72" class="t">ElevenLabs</text>
  <text x="440" y="94" class="sub">speech to text · text to speech</text>

  <g filter="url(#s)"><rect x="800" y="40" width="260" height="90" rx="14" class="ext"/></g>
  <text x="820" y="72" class="t">LLM providers</text>
  <text x="820" y="94" class="sub">Groq gpt-oss · Gemma · Gemini</text>
  <rect x="820" y="104" width="220" height="16" rx="8" class="plug"/>
  <text x="930" y="116" text-anchor="middle" class="sub" font-size="11">any OpenAI-compatible</text>

  <!-- vertical edges into server -->
  <line x1="170" y1="130" x2="170" y2="210" stroke="#1d1c19" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="182" y="174" class="edge">REST · WebSocket</text>

  <line x1="550" y1="130" x2="550" y2="210" stroke="#1d1c19" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="562" y="166" class="edge">OpenAI chat format</text>
  <text x="562" y="182" class="sub">transcript in, speech out</text>

  <line x1="930" y1="130" x2="930" y2="250" stroke="#1d1c19" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Server -->
  <g filter="url(#s)"><rect x="40" y="210" width="1020" height="260" rx="16" class="box"/></g>
  <text x="60" y="236" class="tag">VOICECODE SERVER · NODE</text>

  <rect x="420" y="250" width="260" height="80" rx="12" fill="#e8efff" stroke="#cfdcff"/>
  <text x="440" y="280" class="t2">Custom LLM endpoint</text>
  <text x="440" y="302" class="sub">prompt = rules + live state</text>

  <rect x="800" y="250" width="220" height="80" rx="12" class="iface"/>
  <text x="820" y="274" class="tag">INTERFACE</text>
  <text x="820" y="298" class="t2">LLM provider</text>
  <text x="820" y="318" class="mono">prompt → JSON</text>
  <line x1="680" y1="290" x2="800" y2="290" stroke="#1d1c19" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="250" width="260" height="80" rx="12" class="box"/>
  <text x="100" y="280" class="t2">Orchestrator</text>
  <text x="100" y="302" class="sub">queue · Stop · status from exit codes</text>
  <line x1="420" y1="290" x2="340" y2="290" stroke="#1d1c19" stroke-width="2" marker-end="url(#a)"/>
  <text x="380" y="280" text-anchor="middle" class="edge">actions</text>

  <rect x="420" y="360" width="260" height="80" rx="12" fill="#fdf3e1" stroke="#f3dfb8"/>
  <text x="440" y="390" class="t2">Event analyst</text>
  <text x="440" y="412" class="sub">agent events → what to say</text>
  <line x1="340" y1="400" x2="420" y2="400" stroke="#1d1c19" stroke-width="2" marker-end="url(#a)"/>
  <text x="380" y="390" text-anchor="middle" class="edge">events</text>
  <path d="M680,400 L740,400 L740,290" fill="none" stroke="#1d1c19" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="80" y="360" width="260" height="80" rx="12" class="iface"/>
  <text x="100" y="384" class="tag">INTERFACE</text>
  <text x="100" y="408" class="t2">AgentAdapter</text>
  <text x="100" y="428" class="mono">run · stop · research</text>
  <line x1="210" y1="330" x2="210" y2="360" stroke="#1d1c19" stroke-width="2" marker-end="url(#a)"/>

  <!-- Row 3: agents -->
  <line x1="210" y1="470" x2="210" y2="520" stroke="#1d1c19" stroke-width="2" marker-end="url(#a)"/>
  <line x1="330" y1="470" x2="330" y2="520" stroke="#b3afa5" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <line x1="470" y1="470" x2="470" y2="520" stroke="#b3afa5" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ag)"/>

  <g filter="url(#s)"><rect x="40" y="520" width="240" height="80" rx="14" fill="#e3f5ec" stroke="#c6ead6"/></g>
  <text x="60" y="552" class="t">Codex CLI</text>
  <text x="60" y="574" class="sub">today · writer + read-only research</text>

  <rect x="300" y="520" width="120" height="80" rx="14" class="plug"/>
  <text x="360" y="556" text-anchor="middle" class="t2" fill="#7a776f" style="fill:#7a776f">OpenCode</text>
  <rect x="440" y="520" width="130" height="80" rx="14" class="plug"/>
  <text x="505" y="556" text-anchor="middle" class="t2" style="fill:#7a776f">Claude Code</text>

  <line x1="280" y1="560" x2="800" y2="560" stroke="#1fa463" stroke-width="2" marker-end="url(#a)"/>
  <text x="690" y="552" text-anchor="middle" class="edge" fill="#1fa463" style="fill:#1fa463">edits files, runs builds</text>

  <g filter="url(#s)"><rect x="800" y="520" width="260" height="80" rx="14" class="ext"/></g>
  <text x="820" y="552" class="t">Project</text>
  <text x="820" y="574" class="sub">any repository · PROJECT_DIR</text>

  <text x="40" y="628" class="sub">Solid: implemented. Dashed outline: plugs into the same interface. Grey: external.</text>
</svg>
